<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0E1B2E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EC8FF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- header -->
  <rect x="80" y="64" rx="18" ry="18" width="470" height="40" fill="#5EC8FF" fill-opacity="0.12" stroke="#5EC8FF" stroke-opacity="0.45"/>
  <text x="102" y="91" font-family="Menlo, monospace" font-size="18" fill="#9BDCFF" letter-spacing="2">TELEGRAPH HACKATHON · SEASON II</text>
  <text x="590" y="92" font-family="Helvetica Neue, Helvetica, Arial" font-size="22" font-weight="700" fill="#FFFFFF">SecondSky</text>

  <!-- headline -->
  <text x="80" y="188" font-family="Helvetica Neue, Helvetica, Arial" font-size="60" font-weight="800" fill="#FFFFFF">Same city. Same day.</text>
  <text x="80" y="258" font-family="Helvetica Neue, Helvetica, Arial" font-size="60" font-weight="800" fill="#FFFFFF">Two skies. <tspan fill="#FFB65C">5× apart.</tspan></text>
  <text x="80" y="306" font-family="Menlo, monospace" font-size="20" fill="#8FA3BF">Rainfall · Nairobi · 5 November 2026</text>

  <!-- source A -->
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <rect x="80" y="350" width="690" height="330" rx="24" fill="#5EC8FF" fill-opacity="0.07" stroke="#5EC8FF" stroke-opacity="0.55"/>
    <text x="120" y="405" font-size="16" fill="#9BDCFF" letter-spacing="2">SOURCE A · WEATHER MODEL</text>
    <text x="120" y="440" font-size="26" font-weight="700" fill="#FFFFFF">Open-Meteo</text>
    <text x="120" y="470" font-size="18" fill="#8FA3BF">what Telegraph's weather miners return</text>
    <path d="M160 520 C160 520 128 560 128 581 A32 32 0 0 0 192 581 C192 560 160 520 160 520 Z" fill="url(#blue)"/>
    <text x="222" y="610" font-size="110" font-weight="800" fill="#FFFFFF">3.3<tspan dx="14" font-size="46" font-weight="600" fill="#9BDCFF">mm</tspan></text>
    <text x="120" y="655" font-size="20" fill="#C9D4E5">High 24.3 °C · Low 15.9 °C</text>
  </g>

  <!-- vs -->
  <circle cx="800" cy="515" r="34" fill="#0A1020" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="800" y="523" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="22" font-weight="800" fill="#FFFFFF">vs</text>

  <!-- source B -->
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <rect x="830" y="350" width="690" height="330" rx="24" fill="#FFB65C" fill-opacity="0.07" stroke="#FFB65C" stroke-opacity="0.55"/>
    <text x="870" y="405" font-size="16" fill="#FFD27A" letter-spacing="2">SOURCE B · SATELLITE</text>
    <text x="870" y="440" font-size="26" font-weight="700" fill="#FFFFFF">NASA POWER</text>
    <text x="870" y="470" font-size="18" fill="#8FA3BF">independent satellite-based record</text>
    <path d="M910 520 C910 520 878 560 878 581 A32 32 0 0 0 942 581 C942 560 910 520 910 520 Z" fill="url(#amber)"/>
    <text x="972" y="610" font-size="110" font-weight="800" fill="#FFFFFF">0.6<tspan dx="14" font-size="46" font-weight="600" fill="#FFD27A">mm</tspan></text>
    <text x="870" y="655" font-size="20" fill="#C9D4E5">High 29.1 °C · Low 16.1 °C</text>
  </g>

  <!-- rule -->
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <text x="80" y="752" font-size="30" font-weight="700" fill="#FFFFFF">SecondSky pays only when independent sources agree.</text>
    <text x="80" y="792" font-size="22" fill="#C9D4E5">When they don't, it refuses to settle. The contract buys the evidence itself, on-chain.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="825" x2="1520" y2="825" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="80" y="860" font-family="Menlo, monospace" font-size="17" fill="#8FA3BF">Source A bought on-chain via @Telegraphprotoc (ERC-8183 job) · Source B from NASA POWER API · Sepolia testnet</text>
</svg>
